<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angeli Rock Karaoke — Demo</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#f8f4fb;background:#101019}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#63224c66,transparent 40%),#101019}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:#e52e9c;color:white;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.outline{border:1px solid #635667;background:#29232f}.ghost{background:#272332}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.09em;font-size:19px}.brand span{color:#ff49b7}.pill{border:1px solid #724563;color:#ffaadd;border-radius:99px;padding:5px 9px;font-size:11px}.nav{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0}.nav button{background:#26212c}.nav button.on{background:#b12b80}.panel{background:#201c29;border:1px solid #46364d;border-radius:22px;padding:22px;margin:12px 0;box-shadow:0 15px 45px #09051033}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.muted{color:#b8aabd}.sub{font-size:13px}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.stack{display:grid;gap:12px}input,select{background:#14131c;border:1px solid #59495a;border-radius:12px;padding:12px;color:#fff;width:100%}label{display:grid;gap:7px;font-size:14px}.check{display:flex;align-items:flex-start;gap:10px}.check input{width:18px;height:18px;accent-color:#e52e9c;flex-shrink:0}.check strong{font-size:17px}.bigcheck input{width:25px;height:25px}.warning{color:#ffc87b}.good{color:#7ee6b5}.item{background:#2b2535;border:1px solid #493b53;border-radius:13px;padding:14px;margin:8px 0}.num{font-size:42px;font-weight:900;color:#ff87d0}.stars{display:flex;gap:8px}.stars button{background:#40334b;font-size:27px;padding:10px}.stars button.chosen{background:#9e337f}.reactions{display:flex;gap:8px;flex-wrap:wrap}.reactions button{background:#46324d;font-size:22px}.banner{border-radius:14px;background:linear-gradient(90deg,#7d185d,#d3348d);padding:20px;text-align:center;font-size:22px;font-weight:900}.tv{aspect-ratio:16/9;background:radial-gradient(circle,#49234b,#0a0912 70%);border-radius:15px;border:2px solid #70375a;padding:3%;display:flex;flex-direction:column;justify-content:space-between;text-align:center}.tv h1{font-size:clamp(20px,4vw,60px);margin:8px}.tv .huge{font-size:clamp(36px,8vw,100px);font-weight:900;color:#ff6fc6}.tv .ticker{font-size:clamp(12px,2vw,26px);background:#751e6b;padding:12px;border-radius:12px}.rank{display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid #63516a}.status{margin:12px 0;min-height:20px}.hide{display:none!important}a{color:#ffa2d7}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#302638;border-radius:12px;padding:14px}.card b{display:block;font-size:21px}.timer{font-size:78px;font-weight:900;color:#ff6dba}.hr{height:1px;background:#55445c;margin:14px 0}@media(max-width:720px){.columns,.grid3{grid-template-columns:1fr}.wrap{padding:13px}.tv{aspect-ratio:auto;min-height:360px}.tv .huge{font-size:45px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">✦ ANGELI <span>ROCK</span> KARAOKE</div><span class="pill">PROTOTIPO LOCALE • NON PUBBLICATO</span></header><nav class="nav" id="nav"></nav><div id="content"></div><footer class="muted small" style="margin:24px 0">Demo su un singolo browser: dati salvati localmente. Non inserire dati personali reali. Per uso nel locale serviranno database condiviso, login sicuro, testi privacy verificati e servizio email.</footer></div><script>
const KEY='angeli_karaoke_demo_v1';const sample={people:[],requests:[],performances:[],phase:'idle',current:null,ends:0,started:0,promo:'🍔 LUNEDÌ ALL YOU CAN SMASH · 19,90 € A PERSONA',promoOn:true,notification:true,seconds:30,rankingSeconds:10,reactions:[],votes:{},event:'Karaoke Island',lastSinger:null};let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(sample);let page='cliente',personId=sessionStorage.getItem('karaoke_person')||'',selectedVote=0;const $=s=>document.querySelector(s);const id=()=>crypto.randomUUID();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};const time=()=>Date.now();const current=()=>state.requests.find(x=>x.id===state.current);const remaining=()=>Math.max(0,Math.ceil((state.ends-time())/1000));const accepted=()=>state.requests.filter(x=>x.status==='waiting');const sings=pid=>state.performances.filter(p=>p.personId===pid).length;const estimate=()=>accepted().length*5;
function priority(){return accepted().sort((a,b)=>{let x=sings(a.personId),y=sings(b.personId);return x-y||a.created-b.created})}function allowed(pid){const wait=estimate(),pending=accepted().filter(r=>r.personId===pid).length;const limit=wait<=15?3:wait<=40?1:sings(pid)===0?1:0;return Math.max(0,limit-pending)}function leaderboard(){const a=state.performances.filter(p=>p.score!==null).map(p=>({...p,votesN:p.votesN||0}));return a.sort((x,y)=>(y.weighted-x.weighted)||(y.votesN-x.votesN))}function person(){return state.people.find(x=>x.id===personId)}function notice(s){let n=$('#notice');if(n)n.textContent=s}function shell(content){$('#content').innerHTML='<div id="notice" class="status muted small"></div>'+content}function setPage(p){page=p;render()}function render(){let names=[['cliente','📱 Cliente'],['animatore','🎙️ Animatore'],['tv','📺 Schermo TV'],['ufficio','⚙️ Ufficio']];$('#nav').innerHTML=names.map(([x,n])=>`<button class="${page===x?'on':''}" onclick="setPage('${x}')">${n}</button>`).join('');if(page==='cliente')client();if(page==='animatore')host();if(page==='tv')tv();if(page==='ufficio')office()}
function client(){let p=person();if(!p){shell(`<section class="panel"><h2>🎤 Entra nel Karaoke</h2><p class="muted">Registrazione dimostrativa: usa soltanto dati inventati.</p><form id="reg" class="stack"><label>Nome e cognome<input name="name" required placeholder="Nome e cognome fittizio"></label><label>Email<input name="email" type="email" required placeholder="demo@example.com"></label><label>Telefono<input name="phone" required placeholder="Numero di prova"></label><h3>Termini e condizioni</h3><p class="muted">Acconsento all’utilizzo dei miei dati per:</p><label class="check"><input type="checkbox" id="mk"> <span>Consenso marketing e comunicazioni <a href="#" onclick="event.preventDefault();alert('Testo informativo da predisporre prima della pubblicazione')">Dettaglio</a></span></label><label class="check"><input type="checkbox" id="pr"> <span>Consenso profilazione <a href="#" onclick="event.preventDefault();alert('Testo informativo da predisporre prima della pubblicazione')">Dettaglio</a></span></label><label class="check"><input type="checkbox" id="pv" required> <span>Ho preso visione dell’informativa privacy e trattamento dati * <a href="#" onclick="event.preventDefault();alert('Informativa reale da approvare prima dell’utilizzo con clienti')">Dettaglio</a></span></label><div class="hr"></div><label class="check bigcheck"><input type="checkbox" id="all" onchange="document.querySelectorAll('#mk,#pr,#pv').forEach(e=>e.checked=this.checked)"><strong>AUTORIZZO TUTTI I TRATTAMENTI</strong></label><p class="small muted">Marketing e profilazione sono facoltativi. Il consenso generale è una scorciatoia, non è necessario per cantare.</p><button>Entra nel Karaoke</button></form></section>`);$('#reg').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x={id:id(),name:f.get('name'),email:f.get('email'),phone:f.get('phone'),marketing:$('#mk').checked,profiling:$('#pr').checked,privacy:$('#pv').checked,ts:new Date().toISOString(),policy:'TEST-DA-COMPLETARE'};state.people.push(x);personId=x.id;sessionStorage.setItem('karaoke_person',personId);save()};return}let c=current(),canVote=!!c&&(state.phase==='singing'||state.phase==='voting')&&c.personId!==p.id&&!state.votes[c.id+'_'+p.id];shell(`<section class="panel"><h2>Ciao, ${esc(p.name)}! 🤘</h2><p class="muted">${esc(state.event)} • Tempo stimato coda: circa ${estimate()} minuti</p><div class="grid3"><div class="card"><span class="muted">In attesa</span><b>${accepted().length}</b></div><div class="card"><span class="muted">Tu puoi richiedere</span><b>${allowed(p.id)}</b></div><div class="card"><span class="muted">Stato</span><b>${state.phase==='singing'?'Live':state.phase==='voting'?'Votazione':state.phase==='ranking'?'Classifica':'In attesa'}</b></div></div></section><section class="panel"><h2>🎵 Richiedi una canzone</h2><form id="song" class="stack"><label>Brano<input name="song" required placeholder="Es. Albachiara"></label><label>Artista<input name="artist" required placeholder="Es. Vasco Rossi"></label><label>Nome sullo schermo<input name="nick" required value="${esc(p.name.split(' ')[0])}"></label><button ${allowed(p.id)===0?'disabled':''}>Invia richiesta</button></form><p class="sub muted">Chi non ha ancora cantato ha la priorità. Le richieste aggiuntive si limitano in base all'attesa.</p><h3>Le tue richieste</h3>${state.requests.filter(r=>r.personId===p.id).map(r=>`<div class="item">${esc(r.song)} — ${esc(r.artist)} · ${esc(r.status)} ${r.status==='waiting'?'· #'+(priority().findIndex(z=>z.id===r.id)+1):''}</div>`).join('')||'<p class="muted">Nessuna richiesta.</p>'}</section><section class="panel"><h2>❤️ Partecipa al live</h2>${c?`<p><b>${esc(c.nick)}</b> sta cantando ${esc(c.song)}</p>`:'<p class="muted">Nessuna esibizione in corso.</p>'}${canVote?`<h3>Vota l'esibizione</h3><div class="stars">${[1,2,3,4,5].map(s=>`<button class="${selectedVote===s?'chosen':''}" onclick="selectedVote=${s};render()">${s}★</button>`).join('')}</div><br><button onclick="castVote()" ${selectedVote?'':'disabled'}>Conferma voto</button>`:c?'<p class="muted">Hai già votato, sei il cantante oppure le votazioni sono chiuse.</p>':''}<h3>Emoticon e frasi</h3><div class="reactions">${['🔥','👏','🤘','❤️','😂','😍','Che voce!','Sei una rockstar!','Bis! Bis!'].map(s=>`<button ${state.phase!=='singing'?'disabled':''} onclick="sendReaction('${s}')">${s}</button>`).join('')}</div></section><button class="ghost" onclick="sessionStorage.removeItem('karaoke_person');personId='';render()">Esci da questa sessione demo</button>`);$('#song').onsubmit=e=>{e.preventDefault();if(!allowed(p.id))return;let f=new FormData(e.target);state.requests.push({id:id(),personId:p.id,song:f.get('song'),artist:f.get('artist'),nick:f.get('nick'),status:'waiting',created:time(),video:''});e.target.reset();save()}}
function castVote(){let c=current();if(!c||!selectedVote||!person()||c.personId===personId||!['singing','voting'].includes(state.phase))return;state.votes[c.id+'_'+personId]=selectedVote;selectedVote=0;save()}function sendReaction(v){if(state.phase!=='singing')return;let k='react_'+personId;if(time()-Number(sessionStorage.getItem(k)||0)<5000){notice('Aspetta 5 secondi per un’altra reazione.');return}sessionStorage.setItem(k,time());state.reactions.push({v,at:time()});state.reactions=state.reactions.slice(-15);save()}
function host(){let c=current();shell(`<section class="panel"><h2>🎙️ Regia animatore</h2><p class="warning">Demo senza login: NON usare con pubblico reale.</p><div class="grid3"><div class="card"><span class="muted">Richieste in attesa</span><b>${accepted().length}</b></div><div class="card"><span class="muted">Attesa stimata</span><b>${estimate()} min</b></div><div class="card"><span class="muted">Fase</span><b>${esc(state.phase)}</b></div></div>${c?`<div class="item"><h2>${esc(c.nick)} — ${esc(c.song)}</h2><p>${esc(c.artist)}</p><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query=${encodeURIComponent(c.song+' '+c.artist+' karaoke con testo')}">🔎 Cerca le versioni su YouTube</a><p class="sub muted">Ricerca manuale demo: API YouTube non configurata.</p><label>Link scelto dall'animatore<input id="video" placeholder="URL YouTube" value="${esc(c.video)}"></label><br><button class="outline" onclick="setVideo()">Salva link</button></div>`:''}<div class="row" style="justify-content:flex-start;flex-wrap:wrap">${state.phase==='idle'?`<button onclick="startSong()" ${!accepted().length?'disabled':''}>▶ Avvia prossimo</button>`:''}${state.phase==='singing'?`<button onclick="endSong()">⏹ Fine canzone · 30 s di voto</button>`:''}${state.phase==='voting'?`<button onclick="closeVotes()">Chiudi voti adesso</button>`:''}${state.phase==='ranking'?`<button onclick="finishRanking()">Salta classifica</button>`:''}</div></section><section class="panel"><h2>📋 Coda intelligente</h2>${priority().map((r,i)=>`<div class="item"><div class="row"><div><strong>#${i+1} ${esc(r.nick)}</strong> · ${esc(r.song)} — ${esc(r.artist)}<div class="muted small">Esibizioni precedenti: ${sings(r.personId)}</div></div><button class="outline" onclick="skip('${r.id}')">Salta</button></div></div>`).join('')||'<p class="muted">Coda vuota.</p>'}</section><section class="panel"><h2>🎉 Ultima classifica</h2>${rankingMarkup()}</section>`)}function setVideo(){let c=current();if(c){c.video=$('#video').value.trim();save()}}function startSong(){if(state.phase!=='idle')return;let r=priority()[0];if(!r)return;r.status='singing';state.current=r.id;state.phase='singing';state.started=time();state.reactions=[];save()}function endSong(){if(state.phase!=='singing')return;state.phase='voting';state.ends=time()+state.seconds*1000;save()}function closeVotes(){let c=current();if(!c||state.phase!=='voting')return;let v=Object.entries(state.votes).filter(([k])=>k.startsWith(c.id+'_')).map(([,v])=>v),mean=v.length?v.reduce((a,b)=>a+b,0)/v.length:0;let weighted=(v.reduce((a,b)=>a+b,0)+10*3.5)/(v.length+10);state.performances.push({id:c.id,personId:c.personId,nick:c.nick,song:c.song,score:mean,votesN:v.length,weighted,when:time()});c.status='completed';state.lastSinger=c.nick;state.phase='ranking';state.ends=time()+state.rankingSeconds*1000;save();if(state.notification&&page==='animatore')beep()}function finishRanking(){state.phase='idle';state.current=null;state.ends=0;save()}function skip(i){let r=state.requests.find(r=>r.id===i);if(r&&r.status==='waiting'){r.status='skipped';save()}}function beep(){try{let ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=720;g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.17)}catch(e){}}
function rankingMarkup(){let scores=leaderboard();return scores.length?scores.slice(0,5).map((r,i)=>`<div class="rank"><span>${['🥇','🥈','🥉','4','5'][i]} ${esc(r.nick)} <span class="muted small">${esc(r.song)}</span></span><strong>${r.score.toFixed(1)} ★ <small>(${r.votesN})</small></strong></div>`).join(''):'<p class="muted">Ancora nessuna esibizione completata.</p>'}
function tv(){let c=current(),last=state.performances.at(-1),phase=state.phase,react=state.reactions.filter(x=>time()-x.at<5000).at(-1);shell(`<section class="panel"><div class="row"><h2>📺 Schermo TV / OBS</h2><button class="outline" onclick="document.querySelector('.tv').requestFullscreen?.()">Schermo intero</button></div><div class="tv"><div class="row"><b>✦ ANGELI ROCK KARAOKE</b><span class="pill">${esc(state.event)}</span></div>${phase==='singing'&&c?`<div><p>🎙️ ORA CANTA</p><h1>${esc(c.nick)}</h1><h2>${esc(c.song)}</h2><p>${esc(c.artist)}</p><div class="huge">${esc(react?.v||'🔥 🤘 👏')}</div><p>Vota dal tuo smartphone · Punteggio segreto!</p></div>`:phase==='voting'&&c?`<div><h1>VOTATE L’ESIBIZIONE DI ${esc(c.nick).toUpperCase()}!</h1><div class="timer">${remaining()}</div><p>Ultimi secondi per votare ⭐⭐⭐⭐⭐</p></div>`:phase==='ranking'?`<div><h1>🏆 CLASSIFICA DELLA SERATA</h1>${last?`<p>${esc(last.nick)}: ${last.score.toFixed(1)} ★ (${last.votesN} voti) ${last.score>=4.5&&last.votesN>=10?'⭐ ROCKSTAR!':''}</p>`:''}<div style="max-width:600px;margin:auto">${rankingMarkup()}</div><p>Prossima esibizione tra ${remaining()} secondi</p></div>`:`<div><div class="huge">🎤</div><h1>KARAOKE NIGHT</h1><p>${accepted().length?`Prossimo: ${esc(priority()[0].nick)} — ${esc(priority()[0].song)}`:'Pronti a cantare?'}</p></div>`}<div class="ticker">${state.promoOn?esc(state.promo):'🎸 ANGELI ROCK • CANTA CON NOI'}</div></div></section>`)}
function office(){shell(`<section class="panel"><h2>⚙️ Ufficio • Impostazioni demo</h2><p class="warning">Nessuna protezione accessi o email automatica attiva. Servono backend e provider email.</p><div class="stack"><label>Nome evento<input id="event" value="${esc(state.event)}"></label><label>Promo commerciale per gli schermi<input id="promo" value="${esc(state.promo)}"></label><label class="check"><input type="checkbox" id="promoOn" ${state.promoOn?'checked':''}> Promo attiva</label><label>Secondi votazione finale<input id="seconds" type="number" min="5" max="120" value="${state.seconds}"></label><label>Secondi classifica<input id="ranksecs" type="number" min="2" max="60" value="${state.rankingSeconds}"></label><label class="check"><input type="checkbox" id="notification" ${state.notification?'checked':''}> Notifica breve al termine della votazione</label><button onclick="settings()">Salva impostazioni</button></div></section><section class="panel"><h2>📧 Contatti</h2><div class="grid3"><div class="card"><span class="muted">Registrazioni demo</span><b>${state.people.length}</b></div><div class="card"><span class="muted">Marketing Sì</span><b>${state.people.filter(p=>p.marketing).length}</b></div><div class="card"><span class="muted">Profilazione Sì</span><b>${state.people.filter(p=>p.profiling).length}</b></div></div><p>Destinatario previsto: ufficioangelirock@gmail.com · Invio alle 13:00 (Europe/Rome) del giorno successivo.</p><p class="warning">Stato: DA CONFIGURARE • l'app demo non invia email.</p><button onclick="exportCsv()">⬇ Esporta CSV demo per Pienissimo</button></section><section class="panel"><h2>Reset della demo</h2><button class="outline" onclick="if(confirm('Eliminare tutti i dati di prova?')){localStorage.removeItem(KEY);sessionStorage.removeItem('karaoke_person');personId='';state=structuredClone(sample);save()}">Cancella dati di prova</button></section>`)}function settings(){state.event=$('#event').value;state.promo=$('#promo').value;state.promoOn=$('#promoOn').checked;state.seconds=Math.min(120,Math.max(5,+$('#seconds').value||30));state.rankingSeconds=Math.min(60,Math.max(2,+$('#ranksecs').value||10));state.notification=$('#notification').checked;save()}function exportCsv(){let rows=[['nome','email','telefono','marketing','profilazione','privacy_presa_visione','data_ora','versione_informativa'],...state.people.map(p=>[p.name,p.email,p.phone,p.marketing?'SI':'NO',p.profiling?'SI':'NO',p.privacy?'SI':'NO',p.ts,p.policy])];const csv='\ufeff'+rows.map(a=>a.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='angeli-rock-karaoke-contatti-DEMO.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
window.addEventListener('storage',e=>{if(e.key===KEY){state=JSON.parse(e.newValue||'null')||structuredClone(sample);render()}});setInterval(()=>{if(state.phase==='voting'&&time()>=state.ends){closeVotes()}else if(state.phase==='ranking'&&time()>=state.ends){finishRanking()}else if(page==='tv'&&(state.phase==='singing'||state.phase==='voting'||state.phase==='ranking'))render()},500);render();
</script></body></html>
